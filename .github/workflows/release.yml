name: "Release"

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    name: "Create Release"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for all tags

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify tag matches pyproject.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys
          import tomllib

          with pathlib.Path("pyproject.toml").open("rb") as f:
              version = tomllib.load(f)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"Tag {tag!r} does not match pyproject.toml version {version!r}")
          print(f"Tag {tag} matches pyproject.toml version {version}")
          PY

      - name: Install dependencies
        run: |
          pip install tomli Pillow sphinx rinohtype myst-parser sphinx-book-theme

      - name: Cache Downloads
        id: cache-download
        uses: actions/cache@v6
        with:
          path: download
          key: download-${{hashFiles('pyproject.toml')}}

      - name: Download rhubard binaries
        run: |
         cd scripts
         python rhubarb_bin.py

      - name: Run package script
        run: |
          cd scripts
          python package.py

      - name: Build Sphinx documentation
        run: |
          cd scripts
          python sphinx_build.py

      - name: Verify release artifacts
        run: |
          cd scripts
          python dist_artifacts.py

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            dist/rhubarb_lipsync_ng-*.zip
            dist/rhubarb-lipsync-docs-*.zip
